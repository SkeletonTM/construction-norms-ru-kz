name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверка тестов документации
        run: python3 -m unittest discover -s tests -v
      - name: Проверка схемы карточек
        run: python3 scripts/validate.py --strict
      - name: Проверка ссылок
        run: python3 scripts/validate.py --links
      - name: Каталог собран из карточек
        run: |
          python3 scripts/build_index.py
          git diff --exit-code catalog/README.md catalog/index.json
